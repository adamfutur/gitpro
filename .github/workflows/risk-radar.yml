name: PR Risk Radar checks

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  risk-unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test risk scoring
        run: python -m unittest test_pr_risk -v

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gitverse-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gitverse-ai/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and build
        run: npm run build
